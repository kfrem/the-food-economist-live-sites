name: Deploy EPR and MyProfit to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Configure restricted SSH deployment
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 65002 145.14.153.34 >> ~/.ssh/known_hosts

      - name: Verify remote deployment target
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 65002 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            u609349519@145.14.153.34 \
            'test -d /home/u609349519/domains/thefoodeconomist.co.uk/public_html/epr && test -d /home/u609349519/domains/thefoodeconomist.co.uk/public_html/myprofit'

      - name: Upload Git-managed site files
        run: |
          tar \
            --exclude='epr/api/config.php' \
            --exclude='epr/api/booking-data' \
            --exclude='epr/api/booking-data/*' \
            --exclude='myprofit/api/config.php' \
            --exclude='myprofit/api/booking-data' \
            --exclude='myprofit/api/booking-data/*' \
            -czf - epr myprofit | \
          ssh -i ~/.ssh/id_ed25519 -p 65002 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            u609349519@145.14.153.34 \
            'tar -xzf - -C /home/u609349519/domains/thefoodeconomist.co.uk/public_html'

      - name: Write deployment summary
        run: |
          echo "## Hostinger deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Updated Git-managed EPR and MyProfit files over SSH." >> "$GITHUB_STEP_SUMMARY"
          echo "Protected server configuration and booking data were excluded." >> "$GITHUB_STEP_SUMMARY"
